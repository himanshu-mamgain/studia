# The Studia site (web/): the home page and the shared login for Structura, Schemata
# and DSA Atlas. A static site; Supabase handles the sign-in. It needs VITE_SUPABASE_URL
# and VITE_SUPABASE_PUBLISHABLE_KEY (and later VITE_AUTH_COOKIE_DOMAIN=.studia.dev) in
# the site's environment variables. See docs/accounts.md.
[build]
  command = "npm ci --prefix web && npm run build --prefix web"
  publish = "web/dist"

# The daily plan's reminders (11:00, 17:00 and 21:30): /api/push stores each browser's upcoming
# reminder texts, and push-send sends them every 15 minutes. Needs VAPID_PUBLIC_KEY,
# VAPID_PRIVATE_KEY and VAPID_SUBJECT in the site's environment variables; without them push is off.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# /login and /logout are pages of the one-page site.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
